{% extends "base.html" %}
{% block content %}
<h1><i data-feather="edit-2" class="icon icon-lg"></i> Modifier le produit</h1>

<form method="post" action="{{ url_for('modifier_produit', produit_id=produit.id) }}" class="card-form form-vertical">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" value="{{ produit.nom }}" required>

    <label for="description">Description</label>
    <input type="text" id="description" name="description" value="{{ produit.description }}" placeholder="Origine, usage (sol, plan de travail...)">

    <label for="prix">Prix (MAD)</label>
    <input type="number" id="prix" name="prix" value="{{ produit.prix }}" step="0.01" min="0" required>

    <label for="stock">Stock (m²)</label>
    <input type="number" id="stock" name="stock" value="{{ produit.stock }}" min="0" required>

    <div class="actions">
        <button type="submit"><i data-feather="save" class="icon"></i> Enregistrer</button>
        <a href="{{ url_for('produits') }}" class="btn-secondary"><i data-feather="x" class="icon"></i> Annuler</a>
    </div>
</form>
{% endblock %}
