{% extends "base.html" %}
{% block content %}
<h1>Clients</h1>

<form method="post" action="{{ url_for('ajouter_client') }}" class="card-form">
    <div class="form-row">
        <input type="text" name="nom" placeholder="Nom du client" required>
        <input type="email" name="email" placeholder="Email">
        <input type="text" name="telephone" placeholder="Téléphone">
        <button type="submit">Ajouter</button>
    </div>
</form>

{% if clients %}
<table>
    <thead>
        <tr><th>Nom</th><th>Email</th><th>Téléphone</th><th></th></tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td data-label="Nom">{{ client.nom }}</td>
            <td data-label="Email">{{ client.email or "-" }}</td>
            <td data-label="Téléphone">{{ client.telephone or "-" }}</td>
            <td data-label="Actions" class="actions-cell">
                <a href="{{ url_for('modifier_client', client_id=client.id) }}" class="btn-secondary">Modifier</a>
                <form method="post" action="{{ url_for('supprimer_client', client_id=client.id) }}" onsubmit="return confirm('Supprimer ce client ?');">
                    <button type="submit" class="btn-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="empty">Aucun client pour le moment.</p>
{% endif %}
{% endblock %}
