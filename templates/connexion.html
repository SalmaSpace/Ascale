{% extends "base.html" %}
{% block content %}
<h1><i data-feather="lock" class="icon icon-lg"></i> Connexion — espace de gestion</h1>
<p class="chatbot-intro">Réservée à l'équipe Ascale pour gérer les réservations de créneaux.</p>

<form method="post" class="card-form form-vertical">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="vous@ascale.ma" required autofocus>
    <label for="mot_de_passe">Mot de passe</label>
    <input type="password" name="mot_de_passe" id="mot_de_passe" required>
    <div class="actions">
        <button type="submit"><i data-feather="log-in" class="icon"></i> Se connecter</button>
    </div>
</form>
{% endblock %}
