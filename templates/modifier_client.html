{% extends "base.html" %}
{% block content %}
<h1>Modifier le client</h1>

<form method="post" action="{{ url_for('modifier_client', client_id=client.id) }}" class="card-form form-vertical">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" value="{{ client.nom }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ client.email or '' }}">

    <label for="telephone">Téléphone</label>
    <input type="text" id="telephone" name="telephone" value="{{ client.telephone or '' }}">

    <div class="actions">
        <button type="submit">Enregistrer</button>
        <a href="{{ url_for('clients') }}" class="btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
